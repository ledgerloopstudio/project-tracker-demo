<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<style>
/* ===================================================================
   Project Tracker — visual system
   Offline by design: system font stacks only, no webfont requests.
   =================================================================== */
:root{
  --accent:#1F6B4F; --accent-soft:#E7F2EC; --accent-line:#C7E0D4;
  --accent-deep:#164F3B;
  --bg:#F6F5F2; --bg-2:#EFEFEA;
  --panel:#FFFFFF; --panel-2:#FBFBF9;
  --ink:#14201C; --ink-2:#31453D; --muted:#6B7A73;
  --line:#E4E6E0; --line-soft:#EDEEE9;
  --todo:#8A968F; --doing:#2F6FB0; --review:#B07D2F; --done:#2E9C6E;
  --alert:#C0392B; --warn:#B07D2F;
  --gold:#C9A961;
  --shadow:0 1px 1px rgba(20,32,28,.04),0 3px 10px rgba(20,32,28,.05),0 12px 30px rgba(20,32,28,.04);
  --shadow-lift:0 2px 4px rgba(20,32,28,.06),0 10px 26px rgba(20,32,28,.10);
  --radius:14px; --radius-sm:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-dark="1"]{
  --accent-soft:#12261E; --accent-line:#27473B; --accent-deep:#2E9C6E;
  --bg:#080F0D; --bg-2:#0C1614;
  --panel:#101A17; --panel-2:#132119;
  --ink:#F1F4F2; --ink-2:#C6D2CC; --muted:#8C9C94;
  --line:#1E2E28; --line-soft:#17251F;
  --todo:#7B8A83;
  --shadow:0 1px 1px rgba(0,0,0,.5),0 3px 12px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 62%),
    radial-gradient(900px 520px at 92% 0%, var(--bg-2), transparent 58%);
  background-attachment:fixed;
  font:15px/1.55 var(--sans);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
@supports not (background:color-mix(in srgb,red,blue)){
  body{background-image:radial-gradient(900px 520px at 92% 0%, var(--bg-2), transparent 58%)}
}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:20px;padding:14px 26px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;position:sticky;top:0;z-index:30;
}
@supports not (backdrop-filter:blur(2px)){ .topbar{background:var(--panel)} }
.topbar::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--gold) 55%,var(--accent));
  opacity:.85;
}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.brand-mark{
  width:26px;height:26px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(145deg,var(--accent),var(--accent-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 8px rgba(20,60,44,.28);
}
.brand span:last-child{
  font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;
}
.nav{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.nav button{
  background:none;border:0;padding:8px 14px;border-radius:9px;
  color:var(--muted);font-weight:600;font-size:13.5px;letter-spacing:.005em;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.nav button:hover{background:var(--line-soft);color:var(--ink)}
.nav button.on{
  background:var(--accent-soft);color:var(--accent-deep);font-weight:700;
  box-shadow:inset 0 0 0 1px var(--accent-line);
}
.topright{display:flex;gap:9px;align-items:center}
.linkbtn{
  background:none;border:0;color:var(--muted);font-weight:600;font-size:13.5px;
  padding:8px 12px;border-radius:9px;transition:background .16s var(--ease),color .16s var(--ease);
}
.linkbtn:hover{background:var(--line-soft);color:var(--ink)}

/* ---- layout ---- */
.wrap{padding:30px 26px 56px;max-width:1520px;margin:0 auto}
.page-head{margin-bottom:22px}
.page-head h1{
  margin:0 0 5px;font-family:var(--serif);font-size:30px;font-weight:600;
  letter-spacing:-.018em;line-height:1.15;
}
.page-head p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.row{display:flex;gap:18px;flex-wrap:wrap}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;
}
.card h2{margin:0 0 4px;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.012em}
.card .sub{margin:0 0 16px;color:var(--muted);font-size:13px}

/* ---- kpis ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}
.kpi{
  position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.kpi::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent 78%);opacity:.6;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kpi .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-size:34px;font-weight:600;margin:8px 0 3px;letter-spacing:-.03em;font-family:var(--serif)}
.kpi .note{font-size:12.5px;color:var(--muted)}
.kpi .val.good{color:var(--done)} .kpi .val.bad{color:var(--alert)}

/* ---- board ---- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
.col{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);min-height:170px;
}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.col-head .name{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.count{
  background:var(--bg-2);color:var(--muted);border-radius:20px;
  padding:3px 10px;font-size:11.5px;font-weight:700;
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
.tcard{
  border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-sm);
  padding:13px 14px;margin-bottom:10px;background:var(--panel-2);cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease);
}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--accent-line)}
.tcard .t{font-weight:600;font-size:13.5px;margin-bottom:6px;letter-spacing:-.005em}
.tcard .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.proj{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

/* ---- pills / chips ---- */
.pill{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
}
.pill.q-do{background:#FBE6E3;color:#A5342A}
.pill.q-schedule{background:#E3EFFA;color:#245C93}
.pill.q-delegate{background:#FAF0DC;color:#8A6320}
.pill.q-eliminate{background:#ECEFEE;color:#5F6E67}
.pill.late{background:#FBE6E3;color:#A5342A}
.pill.soon{background:#FAF0DC;color:#8A6320}
[data-dark="1"] .pill.q-do,[data-dark="1"] .pill.late{background:#3A1D1A;color:#F0968A}
[data-dark="1"] .pill.q-schedule{background:#14283C;color:#8FBEE9}
[data-dark="1"] .pill.q-delegate,[data-dark="1"] .pill.soon{background:#33280F;color:#E3BE72}
[data-dark="1"] .pill.q-eliminate{background:#1C2723;color:#9AA8A2}

/* ---- matrix ---- */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.quad{
  position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);min-height:190px;
}
.quad::before{content:"";position:absolute;left:0;right:0;top:0;height:3px}
.quad .qh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.quad .qt{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.012em}
.quad .qs{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.quad.do::before{background:linear-gradient(90deg,var(--alert),transparent 88%)}
.quad.schedule::before{background:linear-gradient(90deg,var(--doing),transparent 88%)}
.quad.delegate::before{background:linear-gradient(90deg,var(--warn),transparent 88%)}
.quad.eliminate::before{background:linear-gradient(90deg,var(--todo),transparent 88%)}

/* ---- gantt ---- */
.gantt{overflow-x:auto;padding-bottom:4px}
.gscale{display:flex;border-bottom:1px solid var(--line);margin-bottom:10px;padding-left:240px}
.gtick{
  flex:1;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding-bottom:8px;border-left:1px solid var(--line-soft);padding-left:8px;
}
.grow{
  display:flex;align-items:center;margin-bottom:8px;min-height:36px;
  border-radius:var(--radius-sm);cursor:pointer;
  transition:background .16s var(--ease);
}
.grow:hover{background:var(--line-soft)}
.glabel{width:240px;flex-shrink:0;padding:0 16px 0 8px}
.glabel .gt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glabel .gm{font-size:11.5px;color:var(--muted)}
.gtrack{
  flex:1;position:relative;height:28px;background:var(--bg-2);border-radius:8px;
  border:1px solid var(--line-soft);
}
.gbar{
  position:absolute;top:5px;height:18px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;min-width:8px;letter-spacing:.03em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 3px rgba(0,0,0,.16);
}
.gbar.done{background:var(--done)} .gbar.late{background:var(--alert)}
.gtoday{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);border-radius:2px}

/* ---- table ---- */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:0 12px 11px;border-bottom:1px solid var(--line);
}
td{padding:13px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tbody tr{transition:background .14s var(--ease)}
tbody tr:hover{background:var(--line-soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* ---- lists ---- */
.lrow{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--line-soft);
}
.lrow:last-child{border-bottom:0}
.lrow .lt{font-weight:600;font-size:13.5px;letter-spacing:-.005em}
.lrow .ls{font-size:12px;color:var(--muted);margin-top:2px}

/* ---- buttons ---- */
.btn{
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;
  letter-spacing:.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(20,60,44,.2),0 4px 12px rgba(20,60,44,.16);
  transition:transform .14s var(--ease),box-shadow .14s var(--ease),filter .14s var(--ease);
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 4px rgba(20,60,44,.22),0 8px 20px rgba(20,60,44,.2)}
.btn:active{transform:translateY(0)}
.btn.ghost{
  background:var(--panel);color:var(--accent-deep);border:1px solid var(--accent-line);
  box-shadow:0 1px 2px rgba(20,32,28,.05);
}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.small{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn.danger{background:linear-gradient(180deg,#CE4436,#A5342A);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(160,50,40,.2)}

/* ---- form ---- */
.field{margin-bottom:15px}
.field label{
  display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:6px;
  letter-spacing:.12em;text-transform:uppercase;
}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel-2);transition:border-color .14s var(--ease),box-shadow .14s var(--ease);
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.field input[type="color"]{padding:4px;height:44px;cursor:pointer}
.field textarea{min-height:74px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.checkrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.checkrow label{
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer;
  padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);
  flex:1;min-width:130px;transition:border-color .14s var(--ease),background .14s var(--ease);
}
.checkrow label:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.checkrow input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

/* ---- modal ---- */
.mask{
  position:fixed;inset:0;background:rgba(6,14,11,.6);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:48px 18px;overflow-y:auto;z-index:60;
}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;
  width:100%;max-width:540px;
  box-shadow:0 24px 70px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.12);
}
.modal h3{margin:0 0 20px;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.015em}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}

/* ---- templates ---- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.tpl{
  display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.tpl:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tpl h2{margin:0 0 5px;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.012em}
.tpl .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.tpl-meta{
  display:flex;gap:8px;align-items:center;font-size:10.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:14px;
}
.tpl-list{list-style:none;margin:0 0 20px;padding:0;flex:1}
.tpl-list li{
  font-size:13px;color:var(--ink-2);padding:6px 0 6px 18px;position:relative;
  border-bottom:1px solid var(--line-soft);
}
.tpl-list li:last-child{border-bottom:0}
.tpl-list li::before{
  content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;
  background:var(--accent-line);
}
.tpl-list li.more{color:var(--muted);font-style:italic}
.tpl-list li.more::before{background:transparent}

/* ---- toggle switch ---- */
.toggle{
  position:relative;width:46px;height:26px;flex-shrink:0;border:0;padding:0;
  border-radius:20px;background:var(--line);cursor:pointer;
  transition:background .18s var(--ease);
  box-shadow:inset 0 1px 3px rgba(20,32,28,.14);
}
.toggle.on{background:var(--accent)}
.toggle .knob{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(20,32,28,.3);
  transition:transform .18s var(--ease);
}
.toggle.on .knob{transform:translateX(20px)}

/* ---- misc ---- */
.empty{color:var(--muted);font-size:13px;padding:22px 0;text-align:center;font-style:italic}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  width:36px;height:36px;border-radius:11px;border:2px solid transparent;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(20,32,28,.16);
  transition:transform .16s var(--ease);
}
.sw:hover{transform:translateY(-2px) scale(1.04)}
.sw.on{border-color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 3px var(--accent-soft)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:width .5s var(--ease)}
.grow1{flex:1;min-width:290px}
@media(max-width:900px){.board{grid-template-columns:1fr 1fr}.matrix{grid-template-columns:1fr}}
@media(max-width:620px){
  .board{grid-template-columns:1fr}.two{grid-template-columns:1fr}
  .wrap{padding:22px 16px 44px}.page-head h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.demo-banner{position:sticky;top:0;z-index:9999;background:#B9770E;color:#fff;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:9px 14px}
.demo-banner a{color:#fff;text-decoration:underline}
.demo-banner .x{position:absolute;right:10px;top:6px;background:none;border:none;color:#fff;font:inherit;cursor:pointer;opacity:.85;padding:4px 8px}
.demo-banner .x:hover{opacity:1}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">DEMO — example data, add up to 15 of your own tasks and see whether it thinks the way you do. Nothing is saved permanently and it can reset any time. <a href="https://www.etsy.com/shop/LedgerLoopStudio" target="_blank" rel="noopener">Buy the full version</a> for your own unlimited, permanent copy.<button class="x" onclick="document.getElementById('demoBanner').style.display='none'" aria-label="Dismiss">✕</button></div>
<div id="app"></div>

<script id="engine">
/* =====================================================================
   ENGINE — pure functions only. No DOM, no storage. Unit-tested directly.
   ===================================================================== */

function pad2(n){ return (n < 10 ? "0" : "") + n; }

function toISO(d){
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function parseISO(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}

function todayISO(){ return toISO(new Date()); }

function addDays(d, n){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}

function daysBetween(a, b){
  if(!a || !b) return 0;
  var ms = new Date(b.getFullYear(), b.getMonth(), b.getDate())
         - new Date(a.getFullYear(), a.getMonth(), a.getDate());
  return Math.round(ms / 86400000);
}

var STATUSES = ["todo", "doing", "review", "done"];

function activeTasks(tasks){
  return (tasks || []).filter(function(t){ return t.archived !== true; });
}

function tasksByStatus(tasks, status){
  return activeTasks(tasks).filter(function(t){ return t.status === status; });
}

function boardColumns(tasks){
  var out = {};
  STATUSES.forEach(function(s){ out[s] = tasksByStatus(tasks, s); });
  return out;
}

function statusCounts(tasks){
  var out = {};
  STATUSES.forEach(function(s){ out[s] = tasksByStatus(tasks, s).length; });
  return out;
}

/* ---- Eisenhower matrix ---------------------------------------------- */

function quadrant(task){
  var u = task.urgent === true, i = task.important === true;
  if(u && i) return "do";
  if(!u && i) return "schedule";
  if(u && !i) return "delegate";
  return "eliminate";
}

var QUADRANTS = ["do", "schedule", "delegate", "eliminate"];

function quadrantTasks(tasks){
  var out = { do: [], schedule: [], delegate: [], eliminate: [] };
  activeTasks(tasks).forEach(function(t){
    if(t.status === "done") return;
    out[quadrant(t)].push(t);
  });
  return out;
}

function quadrantCounts(tasks){
  var q = quadrantTasks(tasks), out = {};
  QUADRANTS.forEach(function(k){ out[k] = q[k].length; });
  return out;
}

/* ---- dates / overdue ------------------------------------------------ */

function isOverdue(task, today){
  if(task.status === "done" || task.archived === true) return false;
  var due = parseISO(task.due), t = parseISO(today);
  if(!due || !t) return false;
  return daysBetween(t, due) < 0;
}

function overdueTasks(tasks, today){
  return activeTasks(tasks).filter(function(t){ return isOverdue(t, today); })
    .sort(function(a, b){ return String(a.due) < String(b.due) ? -1 : 1; });
}

function dueWithin(tasks, today, days){
  var t = parseISO(today);
  if(!t) return [];
  return activeTasks(tasks).filter(function(x){
    if(x.status === "done") return false;
    var d = parseISO(x.due);
    if(!d) return false;
    var diff = daysBetween(t, d);
    return diff >= 0 && diff <= days;
  }).sort(function(a, b){ return String(a.due) < String(b.due) ? -1 : 1; });
}

function daysUntilDue(task, today){
  var due = parseISO(task.due), t = parseISO(today);
  if(!due || !t) return null;
  return daysBetween(t, due);
}

/* ---- Gantt ---------------------------------------------------------- */

function taskDuration(task){
  var s = parseISO(task.start), e = parseISO(task.due);
  if(!s || !e) return 0;
  var n = daysBetween(s, e) + 1;
  return n < 1 ? 1 : n;
}

function timelineRange(tasks){
  var list = activeTasks(tasks).filter(function(t){ return t.start && t.due; });
  if(!list.length) return null;
  var min = null, max = null;
  list.forEach(function(t){
    var s = parseISO(t.start), e = parseISO(t.due);
    if(!s || !e) return;
    if(min === null || s < min) min = s;
    if(max === null || e > max) max = e;
  });
  if(min === null || max === null) return null;
  return { start: toISO(min), end: toISO(max), days: daysBetween(min, max) + 1 };
}

function ganttBars(tasks, rangeStart, rangeEnd){
  var rs = parseISO(rangeStart), re = parseISO(rangeEnd);
  if(!rs || !re) return [];
  var span = daysBetween(rs, re) + 1;
  if(span < 1) return [];
  return activeTasks(tasks).filter(function(t){ return t.start && t.due; })
    .map(function(t){
      var s = parseISO(t.start), e = parseISO(t.due);
      var offset = daysBetween(rs, s);
      var len = daysBetween(s, e) + 1;
      if(offset < 0){ len = len + offset; offset = 0; }
      if(offset + len > span) len = span - offset;
      if(len < 1) len = 1;
      return {
        id: t.id, title: t.title, status: t.status,
        offsetDays: offset, lengthDays: len,
        leftPct: (offset / span) * 100,
        widthPct: (len / span) * 100
      };
    })
    .sort(function(a, b){ return a.offsetDays - b.offsetDays; });
}

function todayMarkerPct(rangeStart, rangeEnd, today){
  var rs = parseISO(rangeStart), re = parseISO(rangeEnd), t = parseISO(today);
  if(!rs || !re || !t) return null;
  var span = daysBetween(rs, re) + 1;
  var off = daysBetween(rs, t);
  if(off < 0 || off >= span) return null;
  return (off / span) * 100;
}

/* ---- progress ------------------------------------------------------- */

function completionRate(tasks){
  var list = activeTasks(tasks);
  if(!list.length) return 0;
  var done = list.filter(function(t){ return t.status === "done"; }).length;
  return Math.round((done / list.length) * 100);
}

function projectTasks(tasks, projectId){

      total: list.length, done: done,
      pct: list.length ? Math.round((done / list.length) * 100) : 0
    };

}

function workloadByAssignee(tasks){
  var map = {};

  return Object.keys(map).map(function(k){ return { name: k, count: map[k] }; })

}

function projectName(projects, id){
  var p = (projects || []).filter(function(x){ return x.id === id; })[0];

function formatDate(iso){
  var d = parseISO(iso);
  if(!d) return "--";
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

}

    if(end > max) max = end;
  });

/* ---------- tiny DOM helper ---------- */

function el(tag, attrs, kids){

  var today = todayISO();
  if(isOverdue(t, today)){
    var late = -daysUntilDue(t, today);
    return el("span", { class: "pill late", text: late === 1 ? "1 day late" : late + " days late" });
  }
  var n = daysUntilDue(t, today);
  if(n !== null && n <= 3){
    return el("span", { class: "pill soon", text: n === 0 ? "Due today" : "in " + n + "d" });
  }
  return null;
}

function viewTimeline(){
  var wrap = el("div");
  wrap.appendChild(pageHead("Timeline",
    "A Gantt view of every task with a start and a due date."));
  var range = timelineRange(STATE.tasks);
  var card = el("div", { class: "card" });
  if(!range){
    card.appendChild(el("div", { class: "empty",
      text: "Give a task a start date and a due date and it will appear here." }));
    wrap.appendChild(card);
    return wrap;
  }
  card.appendChild(el("h2", { text: formatDate(range.start) + " to " + formatDate(range.end) }));
  card.appendChild(el("p", { class: "sub",
    text: range.days + " days across " + ganttBars(STATE.tasks, range.start, range.end).length + " tasks." }));

  var gantt = el("div", { class: "gantt" });
  var scale = el("div", { class: "gscale" });
  var ticks = 5;
  for(var i = 0; i < ticks; i++){
    var dayOff = Math.round((range.days - 1) * (i / ticks));
    var label = formatDate(toISO(addDays(parseISO(range.start), dayOff)));
    scale.appendChild(el("div", { class: "gtick", text: label }));
  }
  gantt.appendChild(scale);

  var marker = todayMarkerPct(range.start, range.end, todayISO());
  var byId = {};
  STATE.tasks.forEach(function(t){ byId[t.id] = t; });

  ganttBars(STATE.tasks, range.start, range.end).forEach(function(b){
    var t = byId[b.id];
    var cls = "gbar";
    if(t.status === "done") cls += " done";
    else if(isOverdue(t, todayISO())) cls += " late";
    var track = el("div", { class: "gtrack" }, [
      el("div", {
        class: cls,
        style: "left:" + b.leftPct.toFixed(2) + "%;width:" + b.widthPct.toFixed(2) + "%",
        text: b.lengthDays + "d"
      }),
      marker === null ? null : el("div", { class: "gtoday",
        style: "left:" + marker.toFixed(2) + "%" })
    ]);
    gantt.appendChild(el("div", { class: "grow", onclick: (function(task){
      return function(){ openTask(task); };
    })(t) }, [
      el("div", { class: "glabel" }, [
        el("div", { class: "gt", text: t.title }),
        el("div", { class: "gm", text: projectName(STATE.projects, t.projectId) +
          " · " + formatDate(t.start) + " – " + formatDate(t.due) })
      ]),
      track
    ]));
  });
  card.appendChild(gantt);
  card.appendChild(el("p", { class: "sub", style: "margin:14px 0 0",
    text: "The amber line marks today. Green bars are done, red bars are overdue." }));
  wrap.appendChild(card);
  return wrap;
}

/* ---------- data actions ---------- */

function exportData(){
  try{
    var blob = new Blob([JSON.stringify(STATE, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "project-tracker-backup.json";
    a.click();
  }catch(e){ alert("Export failed in this browser."); }
}

function importData(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var p = JSON.parse(r.result);
        if(!p || !p.tasks) throw new Error("bad file");
        STATE = normalise(p);
        save(); render();
      }catch(e){ alert("That file is not a Project Tracker backup."); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function resetData(){
  if(!confirm("Reset all data? This clears every project and task in this browser.")) return;
  STATE = sampleState();
  save(); render();
}

function deleteProject(p){
  var n = projectTasks(STATE.tasks, p.id).length;
  var msg = n ? "Delete \"" + p.name + "\"? Its " + n +
    " task(s) stay, but lose their project." : "Delete \"" + p.name + "\"?";
  if(!confirm(msg)) return;
  STATE.projects = STATE.projects.filter(function(x){ return x.id !== p.id; });
  STATE.tasks.forEach(function(t){ if(t.projectId === p.id) t.projectId = null; });
  save(); render();
}

/* ---------- modals ---------- */

function openTask(t){
  MODAL = {
    mode: "task",
    isNew: !t,
    draft: t ? JSON.parse(JSON.stringify(t)) : {
      id: uid(), projectId: (STATE.projects[0] || {}).id || null, title: "",
      status: "todo", urgent: false, important: false,
      start: todayISO(), due: toISO(addDays(new Date(), 7)), assignee: "", notes: ""
    }
  };
  render();
}

function openProject(p){
  MODAL = {
    mode: "project",
    isNew: !p,
    draft: p ? JSON.parse(JSON.stringify(p)) : { id: "p_" + uid(), name: "", color: "#2F6FB0" }
  };
  render();
}

function closeModal(){ MODAL = null; render(); }

function saveModal(){
  var d = MODAL.draft;
  if(MODAL.mode === "task"){
    if(!String(d.title).trim()){ alert("Give the task a title."); return; }
    var i = -1;
    STATE.tasks.forEach(function(x, idx){ if(x.id === d.id) i = idx; });
    if(i >= 0) STATE.tasks[i] = d; else { if(demoLimitReached()) return; STATE.tasks.push(d); }
  } else {
    if(!String(d.name).trim()){ alert("Give the project a name."); return; }
    var j = -1;
    STATE.projects.forEach(function(x, idx){ if(x.id === d.id) j = idx; });
    if(j >= 0) STATE.projects[j] = d; else STATE.projects.push(d);
  }
  save(); MODAL = null; render();
}

function deleteFromModal(){
  var d = MODAL.draft;
  if(MODAL.mode !== "task") return;
  if(!confirm("Delete this task?")) return;
  STATE.tasks = STATE.tasks.filter(function(x){ return x.id !== d.id; });
  save(); MODAL = null; render();
}

function field(label, node){
  return el("div", { class: "field" }, [el("label", { text: label }), node]);
}

  var d = MODAL.draft;
  var titleIn = el("input", { type: "text", value: d.title,
    oninput: function(e){ d.title = e.target.value; } });
  var projSel = el("select", { onchange: function(e){ d.projectId = e.target.value || null; } });
  projSel.appendChild(el("option", { value: "", text: "No project" }));
  STATE.projects.forEach(function(p){
    var o = el("option", { value: p.id, text: p.name });
    if(p.id === d.projectId) o.setAttribute("selected", "selected");
    projSel.appendChild(o);
  });
  var statSel = el("select", { onchange: function(e){ d.status = e.target.value; } });
  STATUSES.forEach(function(s){
    var o = el("option", { value: s, text: STATUS_META[s].label });
    if(s === d.status) o.setAttribute("selected", "selected");
    statSel.appendChild(o);
  });

  return el("div", { class: "modal" }, [
    el("h3", { text: MODAL.isNew ? "Add task" : "Edit task" }),
    field("Title", titleIn),
    el("div", { class: "two" }, [
      field("Project", projSel),
      field("Status", statSel)
    ]),
    el("div", { class: "two" }, [
      field("Start date", el("input", { type: "date", value: d.start || "",
        onchange: function(e){ d.start = e.target.value; } })),
      field("Due date", el("input", { type: "date", value: d.due || "",
        onchange: function(e){ d.due = e.target.value; } }))
    ]),
    field("Assignee", el("input", { type: "text", value: d.assignee || "",
      oninput: function(e){ d.assignee = e.target.value; } })),
    el("div", { class: "checkrow" }, [
      el("label", {}, [
        el("input", { type: "checkbox", checked: d.urgent ? "checked" : null,
          onchange: function(e){ d.urgent = e.target.checked; } }),
        el("span", { text: "Urgent" })
      ]),
      el("label", {}, [
        el("input", { type: "checkbox", checked: d.important ? "checked" : null,
          onchange: function(e){ d.important = e.target.checked; } }),
        el("span", { text: "Important" })
      ])
    ]),
    el("p", { class: "sub", style: "margin:-6px 0 12px",
      text: "These two boxes decide which Eisenhower quadrant the task lands in." }),
    field("Notes", el("textarea", { oninput: function(e){ d.notes = e.target.value; },
      text: d.notes || "" })),
    el("div", { class: "modal-actions" }, [
      MODAL.isNew ? null : el("button", { class: "btn danger", text: "Delete",
        onclick: deleteFromModal }),
      el("button", { class: "btn ghost", text: "Cancel", onclick: closeModal }),
      el("button", { class: "btn", text: "Save task", onclick: saveModal })
    ])
  ]);
}

function projectModal(){
  var d = MODAL.draft;
  return el("div", { class: "modal" }, [
    el("h3", { text: MODAL.isNew ? "Add project" : "Edit project" }),
    field("Name", el("input", { type: "text", value: d.name,
      oninput: function(e){ d.name = e.target.value; } })),
    field("Colour", el("input", { type: "color", value: d.color,
      oninput: function(e){ d.color = e.target.value; } })),
    el("div", { class: "modal-actions" }, [
      el("button", { class: "btn ghost", text: "Cancel", onclick: closeModal }),
      el("button", { class: "btn", text: "Save project", onclick: saveModal })
    ])
  ]);
}

function showModal(root){
  if(!MODAL) return;
  root.appendChild(el("div", { class: "mask", onclick: function(e){
    if(e.target && e.target.className === "mask") closeModal();
  } }, [ MODAL.mode === "task" ? taskModal() : projectModal() ]));
}

/* ---------- shell ---------- */

var VIEWS = [
  ["dash",     "Dashboard",       viewDash],
  ["board",    "Board",           viewBoard],
  ["timeline", "Timeline",        viewTimeline],
  ["matrix",   "Priority Matrix", viewMatrix],
  ["tasks",    "All Tasks",       viewTasks],
  ["templates","Templates",       viewTemplates],
  ["settings", "Settings",        viewSettings]
];

function setView(v){ VIEW = v; render(); }

function render(){
  var root = document.getElementById("app");
  clear(root);

  var a = ACCENTS[STATE.settings.accent] || ACCENTS[0];
  document.documentElement.style.setProperty("--accent", a.v);
  if(!STATE.settings.dark){
    document.documentElement.style.setProperty("--accent-soft", a.soft);
    document.documentElement.style.setProperty("--accent-line", a.line);
  } else {
    document.documentElement.style.removeProperty("--accent-soft");
    document.documentElement.style.removeProperty("--accent-line");
  }
  if(STATE.settings.dark) document.documentElement.setAttribute("data-dark", "1");
  else document.documentElement.removeAttribute("data-dark");

  var nav = el("div", { class: "nav" });
  VIEWS.forEach(function(v){
    nav.appendChild(el("button", {
      class: VIEW === v[0] ? "on" : "",
      text: v[1],
      onclick: (function(k){ return function(){ setView(k); }; })(v[0])
    }));
  });

  root.appendChild(el("div", { class: "topbar" }, [
    el("div", { class: "brand" }, [
      el("span", { class: "brand-mark" }),
      el("span", { text: "Project Tracker" })
    ]),
    nav,
    el("div", { class: "topright" }, [
      el("button", { class: "btn small", text: "+ Task", onclick: function(){ openTask(null); } }),
      el("button", { class: "linkbtn",
        text: STATE.settings.dark ? "Light mode" : "Dark mode",
        onclick: function(){ STATE.settings.dark = !STATE.settings.dark; save(); render(); } })
    ])
  ]));

  var body = VIEWS.filter(function(v){ return v[0] === VIEW; })[0];
  root.appendChild(el("div", { class: "wrap" }, [ (body ? body[2] : viewDash)() ]));

  showModal(root);
}

STATE = load();
if(VIEWS.filter(function(v){ return v[0] === STATE.settings.home; }).length)
  VIEW = STATE.settings.home;
render();

window.__projTrackerTest = {
  render: render,
  getState: function(){ return STATE; },
  setState: function(s){ STATE = s; },
  setView: setView,
  openTask: openTask,
  openProject: openProject,
  closeModal: closeModal
};
})();
</script>
</body>
</html>
